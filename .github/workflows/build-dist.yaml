name: Build card bundle

# Keeps custom_components/scheduler/frontend/scheduler-card.js in step with src/.
#
# HACS installs the contents of custom_components/scheduler/ straight from the
# repository, and the integration serves that file to the frontend, so the
# committed bundle is what installations actually load. Without this, pushing
# source changes alone leaves everyone running the previous build.
#
# The path filter means the commit this job makes (which touches only the
# bundle) cannot retrigger the workflow.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'rollup.config.js'
      - 'tsconfig.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-dist-${{ github.ref }}
  cancel-in-progress: false

env:
  BUNDLE: custom_components/scheduler/frontend/scheduler-card.js

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run rollup

      - name: Commit the bundle if it changed
        run: |
          if git diff --quiet -- "$BUNDLE"; then
            echo "$BUNDLE is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --force "$BUNDLE"
          git commit -m "Build the card bundle for ${GITHUB_SHA::7}"
          git push
