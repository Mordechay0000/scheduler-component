name: Test integration

# Unit tests for the integration. They run the scheduler modules against a
# stub `hass` rather than booting Home Assistant, so they stay fast enough to
# run on every push while still exercising the real dt_util/voluptuous
# behaviour that the time handling depends on.

on:
  push:
    paths:
      - 'custom_components/**'
      - 'tests/python/**'
      - '.github/workflows/test-python.yaml'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install homeassistant pytest

      - name: Run tests
        run: python -m pytest tests/python -q
