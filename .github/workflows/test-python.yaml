name: Test integration

# Unit tests for the integration. They run the scheduler modules against a
# stub `hass` rather than booting Home Assistant, so they stay fast enough to
# run on every push while still exercising the real dt_util/voluptuous
# behaviour that the time handling depends on.

on:
  push:
    paths:
      - 'custom_components/**'
      - 'tests/python/**'
      - '.github/workflows/test-python.yaml'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Two Home Assistants, because the integration supports both: pip gives
        # 3.13 the last release that runs on it, and 3.14 the current one. The
        # newer one is where Home Assistant lets an integration hand its tools
        # to Assist; on the older one the standalone API carries them instead,
        # and only running both proves each path still works.
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pytest-asyncio is what makes the `async def` tests run at all:
          # without it pytest reports every one of them as a failure saying it
          # does not natively support them. pytest.ini asks for its auto mode.
          python -m pip install homeassistant pytest pytest-asyncio

      - name: Run tests
        run: python -m pytest tests/python -q
