[project]
name = "scheduler-mcp"
version = "4.1.0"
description = "MCP server for Shabbat plans in the Home Assistant scheduler"
requires-python = ">=3.11"
dependencies = [
  # 1.x calls the server FastMCP and 2.x calls it MCPServer; the import in
  # server.py accepts either, so both are supported
  "mcp>=1.2.0",
  "httpx>=0.27",
]

[project.scripts]
scheduler-mcp = "scheduler_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scheduler_mcp*"]
