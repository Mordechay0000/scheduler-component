run_action:
  name: Run Action
  description: Execute the action of a schedule, optionally at a given time.
  fields:
    entity_id:
      name: Entity
      description: Identifier of the scheduler entity.
      example: "switch.schedule_abcdef"
      required: true
      selector:
        entity:
          integration: scheduler
          domain: switch
    time:
      name: Time
      description: Time for which to evaluate the action (only useful for schedules with multiple timeslot)
      example: '"12:00"'
      required: false
      selector:
        time:
    skip_conditions:
      name: Skip Conditions
      description: Whether the conditions of the schedule should be skipped or not
      required: false
      selector:
        boolean:

remove:
  name: Remove
  description: Remove a schedule entity
  fields:
    entity_id:
      name: Entity
      description: Identifier of the scheduler entity.
      example: "switch.schedule_abcdef"
      required: true
      selector:
        entity:
          integration: scheduler
          domain: switch

add:
  name: Add
  description: Create a new schedule entity
  fields:
    weekdays:
      name: Weekdays
      description: Days of the week for which the schedule should be repeated
      example: '["daily"]'
      required: false
      selector:
        object:
    start_date:
      name: Start date
      description: Date from which schedule should be executed
      example: '["2021-01-01"]'
      required: false
      selector:
        object:
    end_date:
      name: End date
      description: Date until which schedule should be executed
      example: '["2021-12-31"]'
      required: false
      selector:
        object:
    timeslots:
      name: Timeslots
      description: >
        list of timeslots with their actions and optionally conditions (conditions should be kept the same for all timeslots).
        A timeslot may carry a name, and a track - slots on different tracks form independent timelines, so a boundary that
        concerns one device does not split the others. When two tracks act on the same entity at once, the higher priority
        one owns it. start and stop accept a clock time, sunrise/sunset with an offset, or an entity that publishes a time
        (e.g. "sensor.jewish_calendar_upcoming_candle_lighting-00:18:00").
      example: '[{start: "12:00", stop: "13:00", name: "afternoon", track: "group", priority: 0, actions: [{service: "light.turn_on", entity_id: "light.my_lamp", service_data: {brightness: 200}}]}]'
      required: true
      selector:
        object:
    repeat_type:
      name: Repeat Type
      description: Control what happens after the schedule is triggered
      example: '"repeat"'
      required: true
      selector:
        select:
          options:
            - repeat
            - single
            - pause
    name:
      name: Name
      description: Friendly name for the schedule
      required: false
      example: "My schedule"
      selector:
        text:

